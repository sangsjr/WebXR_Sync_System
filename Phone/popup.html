<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Sync System</title>
    <script src="lib/socket.io.min.js"></script>
  <style>
    body {
      width: 350px;
      padding: 20px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: rgba(0,0,0,0.8);
      color: white;
    }
    
    h1 {
      text-align: center;
      margin: 0 0 20px 0;
      font-size: 24px;
      font-weight: 600;
    }
    
    .input-group {
      margin: 20px 0;
    }
    
    label {
      display: block;
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: 500;
    }
    
    .input-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    input[type="text"] {
      padding: 10px;
      width: 200px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      background: rgba(255,255,255,0.9);
      color: #333;
    }
    
    input[type="text"]::placeholder {
      color: #999;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #4285f4;
    }
    
    .button {
      padding: 15px 30px;
      margin: 15px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.3s ease;
    }
    
    .button:hover {
      background: #3367d6;
      transform: scale(1.05);
    }
    
    .button:active {
      transform: scale(1);
    }
    
    .button.primary {
      background: #4285f4;
    }
    
    .button.primary:hover {
      background: #3367d6;
    }
    
    .button.danger {
      background: #f44336;
    }
    
    .button.danger:hover {
      background: #da190b;
    }
    
    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .button:disabled:hover {
      transform: none;
    }
    
    #generate-room {
      margin: 0;
      padding: 10px 15px;
      font-size: 14px;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }
    
    .button-group .button {
      flex: 1;
      max-width: 150px;
    }
    
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
      text-align: center;
      background: rgba(0,0,0,0.7);
    }
    
    .status.connected {
      background: rgba(76, 175, 80, 0.3);
    }
    
    .status.error {
      background: rgba(244, 67, 54, 0.3);
    }
    
    p {
      text-align: center;
      margin: 10px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
    <h1>WebXR Sync System (Plugin Version)</h1>
    
    <p>Phone</p>
    
    <div class="input-group">
      <label for="room-id">Room ID:</label>
      <div class="input-row">
        <input type="text" id="room-id" placeholder="Enter room ID">
        <button id="generate-room" class="button">Generate</button>
      </div>
    </div>
    
    <p>Share the same Room ID on both devices to sync them.</p>
    
    <div class="button-group">
      <button id="start-btn" class="button primary">Start</button>
      <button id="stop-btn" class="button danger" disabled>Stop</button>
    </div>
    
    <div id="status" class="status">
      Waiting for connection...
    </div>
    
    <script src="popup.js"></script>
</html>
